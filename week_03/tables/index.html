<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Tables Styling</h1>
    <table>
        <caption>December 2026</caption>
        <thead>
            <tr>
                <th scope="col">Sun</th>
                <th scope="col">Mon</th>
                <th scope="col">Tue</th>
                <th scope="col">Wed</th>
                <th scope="col">Thu</th>
                <th scope="col">Fri</th>
                <th scope="col">Sat</th>
            </tr>
        </thead>
        <tbody>
            <!--Week 1 starts on a tuesday, so I need to merge sunday and monday into a single cell-->
            <tr>
                <td colspan="2" class="empty-day">Previous Month</td>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
                <td>5</td>
            </tr>
            <!--Week 2-->
            <tr>
                <td>6</td>
                <td>7</td>
                <td>8</td>
                <td>9</td>
                <td>10</td>
                <td>11</td>
                <td>12</td>
            </tr>
            <!--Week 3-->
            <tr>
                <td>13</td>
                <td>14</td>
                <td>15</td>
                <td>16</td>
                <td>17</td>
                <td>18</td>
                <td>19</td>
            </tr>
            <!--Week 4-->
            <tr>
                <td>20</td>
                <td>21</td>
                <td>22</td>
                <td>23</td>
                <td>24</td>
                <td>25<img src="../images/tree.png""></td>
                <td>26</td>
            </tr>
            <!--Week 5 ends on a Thursday-->
            <tr>
                <td>27</td>
                <td>28<img src="../images/star (2).png"></td>
                <td>29</td>
                <td>30</td>
                <td>31</td>
                <td colspan="2" class="empty-day">Next Month</td>
            </tr>
        </tbody>    
    </table>

    <footer>
        <p><a href="../../index.html">Home</a></p>
    </footer>
</body>
</html>
