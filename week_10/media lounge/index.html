<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gaming Media Lounge</title>
</head>
<body>
    <h1>Gaming Hub Lounge</h1>
    
    <div>
        <h2>Background Hero Video</h2>
        <video autoplay muted loop>
            <source src="../media/hero.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>
    
    <div>
        <h2>Chiptune Soundtrack</h2>
        <audio controls>
            <source src="../media/ambient-track.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>
    
    <div>
        <h2>Featured Gameplay Showcase</h2>
        <div class="ratio ratio-16x9">
            <iframe src="https://www.youtube.com/embed/HWVplmOtG74?si=aZo9HlekZnBy2P_6" title="YouTube video player"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                allowfullscreen>
            </iframe>
        </div>
    </div>

    <footer>
        <p><a href="../../index.html">Home</a></p>
    </footer>

    
</body>
</html>
